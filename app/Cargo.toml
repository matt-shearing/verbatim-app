[package]
name = "verbatim-app"
version = "0.1.0"
edition = "2024"

[dependencies]
iced = { version = "0.14.0", features = ["markdown", "tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "1", default-features = false, features = ["rt", "time"] }
ureq = { version = "=3.4.0", default-features = false, features = ["json"] }

[dev-dependencies]
iced_runtime = "=0.14.0"
tokio = { version = "1", features = ["rt", "time"] }

[profile.release]
strip = true
